name: Build Kernel

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  workflow_dispatch:
    inputs:
      include_resukisu:
        description: '编入 ReSukiSU + SuSFS（同时开启/关闭，默认开启）'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_NOCOMPRESS: "true"
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          path: kernel

      - name: Checkout Watch-GKI tools
        uses: actions/checkout@v7.0.1
        with:
          repository: Dunoguang/Watch-GKI
          path: tools-repo
          sparse-checkout: |
            tools
            KernelSU

      - name: Sync tools into kernel tree
        run: |
          cp -a tools-repo/tools kernel/tools
          cp -a tools-repo/KernelSU kernel/KernelSU
          rm -rf tools-repo
          ls -la kernel/tools/

      - name: Update ReSukiSU submodule to latest main
        if: inputs.include_resukisu != 'false'
        run: |
          DEFAULT_BRANCH=$(git -C kernel/KernelSU remote show origin | sed -n '/HEAD branch/s/.*: //p')
          git -C kernel/KernelSU fetch origin "$DEFAULT_BRANCH"
          git -C kernel/KernelSU checkout --detach "origin/$DEFAULT_BRANCH"
          echo "ReSukiSU HEAD: $(git -C kernel/KernelSU log -1 --format='%h %s')"
          

      - name: Apply ReSukiSU 4.4 customizations
        if: inputs.include_resukisu != 'false'
        run: |
          git -C kernel/KernelSU apply --whitespace=nowarn ../tools/patches/resukisu-4.4.patch || true
          echo "✅ ReSukiSU 4.4 patch applied"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libssl-dev ccache

      - name: Restore ccache
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('kernel/arch/arm64/configs/lineageos_dw99_72_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('kernel/arch/arm64/configs/lineageos_dw99_72_defconfig') }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          aarch64-linux-gnu-gcc --version
          ccache --version
          mkdir -p ~/.ccache
          ccache -M 4G
          ccache -z

      - name: Generate .config
        id: config
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_dw99_72_defconfig
          scripts/config --enable CONFIG_SECCOMP
          scripts/config --enable CONFIG_SECCOMP_FILTER
          if [ "${{ inputs.include_resukisu }}" != "false" ]; then
            echo "::notice::✅ ReSukiSU + SuSFS 编入 (default)"
            scripts/config --enable CONFIG_KSU
            scripts/config --disable CONFIG_KSU_KPROBES_KSUD
            scripts/config --disable CONFIG_KPROBES
            scripts/config --disable CONFIG_KRETPROBES
          else
            echo "::notice::🚫 不编入 ReSukiSU + SuSFS (manual dispatch)"
            scripts/config --disable CONFIG_KSU
            scripts/config --disable CONFIG_KSU_MANUAL_HOOK
            scripts/config --disable CONFIG_KSU_SUSFS
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel + DTB
        run: |
          cd kernel
          export CROSS_COMPILE="ccache aarch64-linux-gnu-"
          set -o pipefail
          make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j$(nproc) Image vmlinux System.map sprd/dw99.dtb 2>&1 | tee /tmp/build.log
          echo "::notice::✅ Build complete at $(date)"

      - name: Report ReSukiSU version
        if: inputs.include_resukisu != 'false'
        run: |
          VCODE=$(grep -oE "ReSukiSU version code: [0-9]+" /tmp/build.log | head -1 | awk '{print $NF}')
          VNAME=$(grep -oE "ReSukiSU version name: .+" /tmp/build.log | head -1 | sed 's/.*name: //')
          HOOK=$(grep -oE "ReSukiSU: using [A-Za-z ]+Hook" /tmp/build.log | head -1 | sed 's/.*using //')
          SUSVER=$(grep -E '^#define SUSFS_VERSION' kernel/include/linux/susfs.h | cut -d'"' -f2)
          { echo "## 🚀 ReSukiSU 版本"; echo ""; echo "- **Version code**: $VCODE"; echo "- **Version name**: $VNAME"; echo "- **Hook method**: $HOOK"; echo "- **SuSFS version**: $SUSVER"; echo "- **Kernel**: $(grep -oE 'KERNEL_VERSION: [^ ]+' /tmp/build.log | head -1 | awk '{print $NF}')"; } >> "$GITHUB_STEP_SUMMARY"
          echo "vcode=$VCODE" >> "$GITHUB_ENV"
          echo "susver=$SUSVER" >> "$GITHUB_ENV"

      - name: ccache stats
        run: |
          ccache -s

      - name: Package boot.img
        run: |
          cd kernel
          python3 tools/mkbootimg.py

      - name: Rename artifact (WGKI naming)
        run: |
          TS=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          if [ "${{ inputs.include_resukisu }}" != "false" ]; then
            ARTIFACT="WGKI-RSSU${vcode}-SuSFS${susver}-SAR-DM-EROFS-ByDunoguang-${TS}"
          else
            ARTIFACT="WGKI-NOKSU-SAR-DM-EROFS-ByDunoguang-${TS}"
          fi
          mv kernel/boot.img "${ARTIFACT}.img"
          echo "artifact=$ARTIFACT" >> "$GITHUB_ENV"
          echo "::notice::✅ 产物: ${ARTIFACT}.img"

      - name: Verify output
        run: |
          ls -lh ${artifact}.img kernel/vmlinux kernel/System.map kernel/arch/arm64/boot/Image kernel/arch/arm64/boot/dts/sprd/dw99.dtb
          file kernel/arch/arm64/boot/Image kernel/vmlinux
          echo "=== vmlinux / System.map sanity ==="
          test -s kernel/vmlinux     || { echo "::error::kernel/vmlinux missing"; exit 1; }
          test -s kernel/System.map  || { echo "::error::kernel/System.map missing"; exit 1; }
          test -s kernel/arch/arm64/boot/Image || { echo "::error::Image missing"; exit 1; }
          echo "vmlinux size    : $(stat -c%s kernel/vmlinux) bytes"
          echo "System.map lines: $(wc -l < kernel/System.map)"
          echo "Image size      : $(stat -c%s kernel/arch/arm64/boot/Image) bytes"

      - name: Dump ELF section sizes (vmlinux)
        run: |
          {
            echo "## vmlinux ELF sections"
            echo ""
            echo "| section | size (bytes) | addr |"
            echo "|---------|-------------:|------|"
            readelf -S -W kernel/vmlinux \
              | awk '/^ *\[[ 0-9]+\]/ {match($0,/\[[ 0-9]+\]/); nm=substr($0,RSTART,RLENGTH); gsub(/[][ ]/,"",nm); \$0=substr($0,RSTART+RLENGTH); n=split($0,a," "); name=a[1]; if(name=="")name=a[2]; for(i=1;i<=n;i++) if(a[i] ~ /^[0-9a-f]{16}$/){addr=a[i]; break} sz="-"; for(i=1;i<=n;i++) if(a[i] ~ /^[0-9a-f]{6,}$/ && a[i]!=addr){sz=a[i]; break} if(name!="") printf "| %s | %s | 0x%s |\n", name, sz, addr }'
            echo ""
            echo "### key symbols (System.map)"
            echo '```'
            grep -E " (_stext|_etext|__init_begin|__init_end|__bss_start|_edata|_end|__start_rodata|__end_rodata)$" kernel/System.map || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('kernel/arch/arm64/configs/lineageos_dw99_72_defconfig') }}-${{ github.run_id }}

      - name: Upload boot.img + vmlinux + System.map + Image + dtb
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.artifact }}
          path: |
            ${{ env.artifact }}.img
            kernel/vmlinux
            kernel/System.map
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/sprd/dw99.dtb

      - name: ☁️ 上传到 Tempfile
        if: always()
        continue-on-error: true
        run: |
          FILES=( "${artifact}.img" )

          if [ ! -f "${artifact}.img" ]; then
            echo "⚠️ 产物不存在 (${artifact}.img)，跳过 Tempfile 上传" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for f in \
              "${artifact}.img" \
              "kernel/vmlinux" \
              "kernel/System.map" \
              "kernel/arch/arm64/boot/Image" \
              "kernel/arch/arm64/boot/dts/sprd/dw99.dtb" ; do
            [ -f "$f" ] && FILES+=( "$f" )
          done

          echo "📤 上传 ${#FILES[@]} 个文件到 Tempfile..."
          FORM=()
          for f in "${FILES[@]}"; do FORM+=( -F "files=@${f}" ); done
          RESP=$(curl -sS -X POST https://tempfile.org/api/upload/local \
            "${FORM[@]}" -F "expiryHours=48")
          echo "$RESP" > /tmp/tempfile.json
          cat /tmp/tempfile.json | head -c 500
          URL=$(python3 -c "import sys,json; d=json.load(open('/tmp/tempfile.json')); print(d['files'][0]['url'] + 'download')")
          {
            echo "## ☁️ Tempfile 下载"
            echo ""
            echo "| 📦 产物 | 🔗 链接 | 📏 大小 | ⏰ 有效期 |"
            echo "|---------|---------|---------|-----------|"
            python3 -c "
import json,os
d=json.load(open('/tmp/tempfile.json'))
for it in d['files']:
    u=it['url']+'download'
    nm=it.get('name') or it.get('filename') or u
    p=os.path.basename(nm)
    for cand in ['${artifact}.img','kernel/arch/arm64/boot/dts/sprd/dw99.dtb','kernel/arch/arm64/boot/Image','kernel/vmlinux','kernel/System.map']:
        if os.path.basename(cand)==p:
            p=cand; break
    sz=''
    try:
        sz=os.path.getsize(p)
        sz='%.1f MiB'%(sz/1048576.0)
    except Exception: pass
    print('| %s | [点击下载](%s) | %s | 48 小时 |'%(p,u,sz))
"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TEMP_URL=${URL}"
