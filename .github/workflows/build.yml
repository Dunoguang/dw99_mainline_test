name: Build Kernel

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_NOCOMPRESS: "true"
      CCACHE_DIR: /home/runner/.ccache
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libssl-dev ccache

      - name: Restore ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_72_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_72_defconfig') }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          aarch64-linux-gnu-gcc --version
          ccache --version
          mkdir -p ~/.ccache
          ccache -M 4G
          ccache -z

      - name: Generate .config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_dw99_72_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^CONFIG_(KSU|KSU_SUSFS|PANIC_ON_OOPS|PANIC_TIMEOUT)' .config | sort

      - name: Build kernel + DTB
        run: |
          set -o pipefail
          make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j$(nproc) \
               Image sprd/dw99.dtb 2>&1 | tee /tmp/build.log
          echo "::notice::✅ Build complete at $(date)"

      - name: Report versions
        run: |
          KVER=$(make -s kernelversion)
          SUSVER=$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h | cut -d'"' -f2)
          KSUVNAME=$(grep -oE 'BakaSU version name: .+' /tmp/build.log | head -1 | sed 's/.*name: //')
          KSUVCODE=$(grep -oE 'BakaSU version code: [0-9]+' /tmp/build.log | head -1 | awk '{print $NF}')
          HOOK=$(grep -oE 'BakaSU: using [A-Za-z ]+Hook' /tmp/build.log | head -1 | sed 's/.*using //')
          PANICOOP=$(grep -E '^CONFIG_PANIC_ON_OOPS=y' .config | cut -d= -f1)
          PANICTO=$(grep -E '^CONFIG_PANIC_TIMEOUT=' .config | cut -d= -f2)
          {
            echo "## 🚀 Build info"
            echo ""
            echo "| item | value |"
            echo "|------|-------|"
            echo "| Kernel | $KVER |"
            echo "| BakaSU | $KSUVNAME (code $KSUVCODE) |"
            echo "| Hook method | $HOOK |"
            echo "| SuSFS | $SUSVER |"
            echo "| Panic on oops | $PANICOOP |"
            echo "| Panic timeout (reboot) | ${PANICTO}s |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "kver=$KVER" >> "$GITHUB_ENV"
          echo "susver=$SUSVER" >> "$GITHUB_ENV"
          echo "ksuvcode=$KSUVCODE" >> "$GITHUB_ENV"

      - name: ccache stats
        run: ccache -s

      - name: Package boot.img
        run: python3 tools/mkbootimg.py

      - name: Rename artifact
        run: |
          TS=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          ARTIFACT="WGKI-BakaSU${ksuvcode}-SuSFS${susver}-K${kver}-SAR-DM-EROFS-ByDunoguang-${TS}"
          mv boot.img "${ARTIFACT}.img"
          echo "artifact=$ARTIFACT" >> "$GITHUB_ENV"
          echo "::notice::✅ 产物: ${ARTIFACT}.img"

      - name: Verify output
        run: |
          ls -lh "${artifact}.img" vmlinux System.map arch/arm64/boot/Image arch/arm64/boot/dts/sprd/dw99.dtb
          file arch/arm64/boot/Image vmlinux
          test -s vmlinux                   || { echo "::error::vmlinux missing"; exit 1; }
          test -s System.map                || { echo "::error::System.map missing"; exit 1; }
          test -s arch/arm64/boot/Image     || { echo "::error::Image missing"; exit 1; }
          test -s arch/arm64/boot/dts/sprd/dw99.dtb || { echo "::error::dtb missing"; exit 1; }

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_72_defconfig') }}-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.artifact }}
          path: |
            ${{ env.artifact }}.img
            vmlinux
            System.map
            arch/arm64/boot/Image
            arch/arm64/boot/dts/sprd/dw99.dtb

      - name: ☁️ 上传到 Tempfile
        if: always()
        continue-on-error: true
        run: |
          FILES=()
          for f in "${artifact}.img" vmlinux System.map arch/arm64/boot/Image arch/arm64/boot/dts/sprd/dw99.dtb; do
            if [ -f "$f" ]; then FILES+=("$f"); fi
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "⚠️ 无产物，跳过 Tempfile 上传" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FORM=()
          for f in "${FILES[@]}"; do FORM+=( -F "files=@${f}" ); done
          curl -sS -X POST https://tempfile.org/api/upload/local "${FORM[@]}" -F "expiryHours=48" -o /tmp/tempfile.json || true
          head -c 300 /tmp/tempfile.json || true
          echo ""
          for f in "${FILES[@]}"; do
            P=$(python3 -c "import json,os,sys; d=json.load(open('/tmp/tempfile.json')); tgt=os.path.basename('$f'); print(next((i['url']+'download' for i in d['files'] if os.path.basename(i.get('name') or i.get('filename') or '')==tgt), d['files'][0]['url']+'download'))" 2>/dev/null || echo "")
            if [ -z "$P" ]; then continue; fi
            SZ=$(stat -c%s "$f")
            MIB=$(awk -v s="$SZ" 'BEGIN{printf "%.1f", s/1048576}')
            echo "| ${f} | [点击下载](${P}) | ${MIB} MiB | 48 小时 |" >> "$GITHUB_STEP_SUMMARY"
          done
